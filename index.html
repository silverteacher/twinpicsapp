/* ─── Helpers ─── */
function getDailyImage() {
  const start = new Date('2026-02-11');
  const diffDays = Math.floor(Math.abs(new Date() - start) / 86400000);
  return { data: DAILY_IMAGES[diffDays % DAILY_IMAGES.length], num: (diffDays % DAILY_IMAGES.length) + 1 };
}

function blobToBase64(blob) {
  return new Promise(resolve => {
    const r = new FileReader();
    r.onloadend = () => resolve({ b64: r.result.split(',')[1], mime: blob.type || 'image/jpeg' });
    r.readAsDataURL(blob);
  });
}

function scoreColor(s) {
  if (s >= 80) return '#22c55e';
  if (s >= 60) return '#eab308';
  if (s >= 40) return '#f97316';
  return '#ef4444';
}
function scoreBadge(s) {
  if (s >= 80) return '🏆 Excellent !';
  if (s >= 60) return '👍 Bien joué !';
  if (s >= 40) return '🎯 Pas mal !';
  return '💪 Continue !';
}

/* ─── App principale ─── */
function App() {
  const [hfToken, setHfToken]     = useState('');
  const [tokenOk, setTokenOk]     = useState(false);
  const [prompt, setPrompt]       = useState('');
  const [loading, setLoading]     = useState(false);
  const [step, setStep]           = useState('');
  const [genImg, setGenImg]       = useState(null);
  const [score, setScore]         = useState(null);
  const [history, setHistory]     = useState([]);
  const [error, setError]         = useState('');

  const { data: daily, num: dayNum } = getDailyImage();
  const dateStr = new Date().toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' });

  useEffect(() => {
    const h = localStorage.getItem('tpHistory');
    if (h) setHistory(JSON.parse(h));
    const t = localStorage.getItem('hfToken');
    if (t) { setHfToken(t); setTokenOk(true); }
  }, []);

  const saveToken = () => {
    const t = hfToken.trim();
    if (!t) return;
    localStorage.setItem('hfToken', t);
    setTokenOk(true);
  };

  const generate = async () => {
    if (!hfToken || !prompt.trim()) return;
    setLoading(true); setError(''); setGenImg(null); setScore(null);

    try {
      /* 1 – Génération FLUX.1 */
      setStep('🎨 Génération de l\'image avec FLUX.1-schnell...');
      const hfResp = await fetch(
        'https://api-inference.huggingface.co/models/black-forest-labs/FLUX.1-schnell',
        {
          method: 'POST',
          headers: { Authorization: `Bearer ${hfToken.trim()}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ inputs: prompt, parameters: { num_inference_steps: 4 } })
        }
      );
      if (!hfResp.ok) {
        const txt = await hfResp.text();
        let msg = `Hugging Face ${hfResp.status}`;
        try { const j = JSON.parse(txt); if (j.error) msg = j.error; } catch {}
        throw new Error(msg);
      }
      const blob = await hfResp.blob();
      const { b64: genB64, mime: genMime } = await blobToBase64(blob);
      setGenImg(`data:${genMime};base64,${genB64}`);

      /* 2 – Scoring Claude Vision */
      setStep('🔍 Analyse et scoring par Claude Vision...');
      const refResp = await fetch(daily.url);
      const refBlob = await refResp.blob();
      const { b64: refB64, mime: refMime } = await blobToBase64(refBlob);

      const claudeResp = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-5-20250929',
          max_tokens: 1024,
          messages: [{
            role: 'user',
            content: [
              { type:'image', source:{ type:'base64', media_type: refMime, data: refB64 } },
              { type:'image', source:{ type:'base64', media_type: genMime, data: genB64 } },
              { type:'text', text:`Tu es un juge expert en art visuel. Compare la PREMIÈRE image (référence) avec la SECONDE (tentative générée par IA).\n\nNote de 0 à 100 basée sur :\n- Composition (25pts)\n- Palette de couleurs (25pts)\n- Éléments clés présents (25pts)\n- Style et ambiance (25pts)\n\nRéponds UNIQUEMENT avec ce JSON exact (sans markdown) :\n{"score":75,"composition":"analyse courte en français","colors":"analyse courte en français","elements":"analyse courte en français","overall":"conclusion courte en français"}` }
            ]
          }]
        })
      });

      if (!claudeResp.ok) throw new Error('Erreur Claude Vision (scoring)');
      const cData = await claudeResp.json();
      const raw = cData.content.find(c => c.type === 'text')?.text || '{}';
      let analysis;
      try {
        analysis = JSON.parse(raw.replace(/```json\n?|```\n?/g,'').trim());
      } catch {
        const m = raw.match(/\{[\s\S]*\}/);
        analysis = m ? JSON.parse(m[0]) : { score:50, composition:'N/A', colors:'N/A', elements:'N/A', overall:'Analyse indisponible' };
      }
      setScore(analysis);

      /* Historique */
      const entry = { prompt, score: analysis.score, overall: analysis.overall, ts: new Date().toISOString() };
      const nh = [entry, ...history].slice(0, 10);
      setHistory(nh);
      localStorage.setItem('tpHistory', JSON.stringify(nh));

    } catch (e) {
      console.error(e);
      setError(e.message);
    } finally {
      setLoading(false); setStep('');
    }
  };

  return (
    <div style={{ maxWidth: 1280, margin: '0 auto' }}>

      {/* ── HEADER ── */}
      <div style={{ textAlign:'center', marginBottom:36 }}>
        <h1 className="orb" style={{ fontSize:'clamp(2.2rem,7vw,4.5rem)', fontWeight:900, background:'linear-gradient(135deg,#ff6b35,#00d9ff,#ffd700)', WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent' }}>
          🎮 TWIN PICS
        </h1>
        <p style={{ color:'#777', marginTop:8, fontSize:'1.05rem' }}>Défi Quotidien de Génération d'Images IA</p>
      </div>

      {/* ── CLEF API ── */}
      {!tokenOk ? (
        <div className="card fadein" style={{ maxWidth:580, margin:'0 auto 32px', border:'1px solid rgba(0,217,255,0.35)' }}>
          <h3 className="orb" style={{ color:'#00d9ff', marginBottom:10, fontSize:'1rem' }}>🔑 Clé API Hugging Face</h3>
          <p style={{ color:'#aaa', fontSize:'0.88rem', marginBottom:16, lineHeight:1.6 }}>
            Entrez votre token HF pour générer des images avec FLUX.1-schnell.<br/>
            <a href="https://huggingface.co/settings/tokens" target="_blank" rel="noopener" style={{ color:'#00d9ff' }}>Obtenir un token →</a>
          </p>
          <div style={{ display:'flex', gap:10 }}>
            <input type="password" value={hfToken} onChange={e => setHfToken(e.target.value)} placeholder="hf_xxxxxxxxxxxxxxxx"
              onKeyDown={e => e.key === 'Enter' && saveToken()} />
            <button className="btn" onClick={saveToken}
              style={{ background:'linear-gradient(135deg,#00d9ff,#0095bb)', color:'white', padding:'12px 22px', borderRadius:12, fontSize:'0.9rem', whiteSpace:'nowrap' }}>
              Valider
            </button>
          </div>
        </div>
      ) : (
        <div style={{ display:'flex', alignItems:'center', justifyContent:'center', gap:12, marginBottom:24 }}>
          <span style={{ color:'#22c55e', fontSize:'0.9rem' }}>✅ Token Hugging Face configuré</span>
          <button className="btn" onClick={() => { setTokenOk(false); localStorage.removeItem('hfToken'); }}
            style={{ background:'rgba(255,255,255,0.08)', color:'#aaa', padding:'5px 14px', borderRadius:8, fontSize:'0.78rem' }}>
            Modifier
          </button>
        </div>
      )}

      {/* ── BANDEAU INFO ── */}
      <div style={{ marginBottom:24, background:'rgba(0,217,255,0.07)', border:'1px solid rgba(0,217,255,0.22)', borderRadius:14, padding:'12px 18px', fontSize:'0.88rem', color:'#bbb' }}>
        <strong style={{ color:'#00d9ff' }}>📸 Comment jouer ?</strong>
        <span style={{ marginLeft:8 }}>Observez l'image de référence, rédigez un prompt de 100 caractères max (en anglais), et découvrez votre score de similarité calculé par Claude Vision !</span>
      </div>

      {/* ── GRILLE PRINCIPALE ── */}
      <div className="main-grid" style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:24 }}>

        {/* Référence */}
        <div className="card">
          <h2 className="orb" style={{ color:'#ffd700', fontSize:'1.35rem', marginBottom:18, letterSpacing:1 }}>🎯 Image Référence</h2>

          <div style={{ background:'linear-gradient(135deg,rgba(255,107,53,0.12),rgba(0,217,255,0.12))', borderRadius:12, padding:14, marginBottom:16, border:'1px solid rgba(255,255,255,0.07)' }}>
            <div className="orb" style={{ color:'#ffd700', fontSize:'0.8rem', marginBottom:6 }}>Défi #{dayNum} — {dateStr}</div>
            <div style={{ color:'white', fontSize:'0.95rem', lineHeight:1.5 }}>{daily.desc}</div>
          </div>

          <div style={{ aspectRatio:'1', borderRadius:14, overflow:'hidden', marginBottom:16, border:'2px solid rgba(255,255,255,0.1)' }}>
            <img src={daily.url} alt="Référence" style={{ width:'100%', height:'100%', objectFit:'cover' }} />
          </div>

          <div style={{ background:'rgba(0,0,0,0.3)', borderRadius:12, padding:14 }}>
            <p style={{ color:'#888', fontSize:'0.84rem', marginBottom:8 }}>💡 Indices :</p>
            {daily.hints.map((h, i) => (
              <div key={i} style={{ color:'#ccc', fontSize:'0.84rem', marginBottom:5, display:'flex', alignItems:'center', gap:8 }}>
                <span style={{ color:'#00d9ff' }}>▸</span>{h}
              </div>
            ))}
          </div>
        </div>

        {/* Création */}
        <div className="card">
          <h2 className="orb" style={{ color:'#ffd700', fontSize:'1.35rem', marginBottom:18, letterSpacing:1 }}>✨ Votre Création</h2>

          {/* Prompt */}
          <div style={{ marginBottom:16 }}>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:6 }}>
              <span style={{ color:'#888', fontSize:'0.84rem' }}>Votre prompt (anglais recommandé)</span>
              <span style={{ fontSize:'0.84rem', color: prompt.length >= 90 ? '#ff6b35' : '#888', fontWeight: prompt.length >= 90 ? 600 : 400 }}>
                {prompt.length}/100
              </span>
            </div>
            <div style={{ background:'rgba(255,215,0,0.07)', border:'1px solid rgba(255,215,0,0.22)', borderRadius:10, padding:'8px 14px', marginBottom:10, fontSize:'0.8rem', color:'#d4b800' }}>
              ⚠️ Prompt en <strong>anglais</strong> pour de meilleurs résultats avec FLUX.1
            </div>
            <textarea
              value={prompt}
              onChange={e => setPrompt(e.target.value.slice(0,100))}
              placeholder={"Describe the scene in English (max 100 chars)...\nEx: astronaut floating in space orange blue nebula"}
              maxLength={100}
              rows={4}
              style={{ width:'100%' }}
            />
          </div>

          {/* Bouton */}
          <button
            className="btn"
            onClick={generate}
            disabled={loading || !prompt.trim() || !tokenOk}
            style={{
              width:'100%', padding:'15px', borderRadius:14, fontSize:'1rem', color:'white',
              background: loading ? 'rgba(255,107,53,0.35)' : 'linear-gradient(135deg,#ff6b35,#ff8c5a)',
              boxShadow: loading ? 'none' : '0 4px 22px rgba(255,107,53,0.4)',
              display:'flex', alignItems:'center', justifyContent:'center', gap:12
            }}
          >
            {loading ? <><Spinner size={22} color="white" />{step || 'Génération...'}</> : '🚀 Générer l\'Image'}
          </button>

          {/* Erreur */}
          {error && (
            <div className="fadein" style={{ marginTop:14, background:'rgba(239,68,68,0.12)', border:'1px solid rgba(239,68,68,0.35)', borderRadius:12, padding:14, color:'#fca5a5', fontSize:'0.88rem', lineHeight:1.6 }}>
              ❌ {error}
            </div>
          )}

          {/* Skeleton pendant génération */}
          {loading && !genImg && (
            <div style={{ marginTop:18, aspectRatio:'1', borderRadius:14, background:'rgba(0,0,0,0.25)', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:18 }}>
              <Spinner size={52} />
              <p style={{ color:'#666', textAlign:'center', fontSize:'0.88rem' }}>{step}</p>
            </div>
          )}

          {/* Image générée */}
          {genImg && (
            <div className="fadein" style={{ marginTop:18, aspectRatio:'1', borderRadius:14, overflow:'hidden', border:'2px solid rgba(255,255,255,0.1)' }}>
              <img src={genImg} alt="Généré" style={{ width:'100%', height:'100%', objectFit:'cover' }} />
            </div>
          )}

          {/* Score */}
          {score && (
            <div className="pop" style={{ marginTop:18 }}>
              <div style={{ background:'linear-gradient(135deg,rgba(255,215,0,0.18),rgba(255,107,53,0.18))', borderRadius:14, padding:'22px', textAlign:'center', border:`2px solid ${scoreColor(score.score)}`, marginBottom:14 }}>
                <div className="orb" style={{ fontSize:'5rem', fontWeight:900, color:scoreColor(score.score), lineHeight:1, marginBottom:6 }}>
                  {score.score}
                </div>
                <div style={{ fontSize:'1.4rem', marginBottom:4 }}>{scoreBadge(score.score)}</div>
                <div style={{ color:'#888', fontSize:'0.9rem' }}>Score de Similarité / 100</div>
              </div>

              <div style={{ background:'rgba(0,0,0,0.3)', borderRadius:12, padding:16, fontSize:'0.88rem', color:'#ccc', lineHeight:2 }}>
                <div><strong style={{ color:'white' }}>Composition :</strong> {score.composition}</div>
                <div><strong style={{ color:'white' }}>Couleurs :</strong> {score.colors}</div>
                <div><strong style={{ color:'white' }}>Éléments :</strong> {score.elements}</div>
                <div style={{ marginTop:6, color:'#00d9ff' }}><strong>Conclusion :</strong> {score.overall}</div>
              </div>
            </div>
          )}
        </div>
      </div>

      {/* ── HISTORIQUE ── */}
      {history.length > 0 && (
        <div className="card fadein" style={{ marginTop:24 }}>
          <h2 className="orb" style={{ color:'#ffd700', fontSize:'1.35rem', marginBottom:16, letterSpacing:1 }}>📊 Historique des Tentatives</h2>
          <div style={{ display:'flex', flexDirection:'column', gap:10, maxHeight:340, overflowY:'auto' }}>
            {history.map((e, i) => {
              const t = new Date(e.ts).toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
              return (
                <div key={i} style={{ background:'rgba(0,0,0,0.28)', borderRadius:12, padding:'12px 16px', borderLeft:`4px solid ${scoreColor(e.score)}`, display:'flex', alignItems:'center', gap:16 }}>
                  <div className="orb" style={{ fontSize:'1.7rem', fontWeight:700, color:scoreColor(e.score), minWidth:54, textAlign:'center' }}>{e.score}</div>
                  <div style={{ flex:1, overflow:'hidden' }}>
                    <div style={{ fontWeight:500, color:'white', marginBottom:3, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>"{e.prompt}"</div>
                    <div style={{ fontSize:'0.82rem', color:'#777', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{e.overall}</div>
                  </div>
                  <div style={{ fontSize:'0.78rem', color:'#555', whiteSpace:'nowrap' }}>{t}</div>
                </div>
              );
            })}
          </div>
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
